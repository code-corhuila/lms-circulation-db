databaseChangeLog:
  - changeSet:
      id: dcl-roles-001
      author: OscarAreiza
      labels: "governance,dcl,roles"
      comment: "circulation_reader/circulation_writer, no password — rules/2-anexos/B-db-mongo.md: roles via createRole, the infrastructure creates the actual login users"
      changes:
        - runCommand:
            command: >
              {
                createRole: "circulation_reader",
                privileges: [
                  { resource: { db: "loan_db", collection: "loans" }, actions: ["find"] }
                ],
                roles: []
              }
        - runCommand:
            command: >
              {
                createRole: "circulation_writer",
                privileges: [
                  { resource: { db: "loan_db", collection: "loans" }, actions: ["find", "insert", "update"] }
                ],
                roles: []
              }
      rollback:
        - runCommand:
            command: '{ "dropRole": "circulation_reader" }'
        - runCommand:
            command: '{ "dropRole": "circulation_writer" }'
  - changeSet:
      id: dcl-roles-002
      author: OscarAreiza
      labels: "governance,dcl,roles"
      comment: "grants both roles access to idempotency_keys — a new changeset, not an edit to dcl-roles-001 (rule: an applied changeset never changes)"
      changes:
        - runCommand:
            command: >
              {
                grantPrivilegesToRole: "circulation_reader",
                privileges: [
                  { resource: { db: "loan_db", collection: "idempotency_keys" }, actions: ["find"] }
                ]
              }
        - runCommand:
            command: >
              {
                grantPrivilegesToRole: "circulation_writer",
                privileges: [
                  { resource: { db: "loan_db", collection: "idempotency_keys" }, actions: ["find", "insert"] }
                ]
              }
      rollback:
        - runCommand:
            command: >
              {
                revokePrivilegesFromRole: "circulation_reader",
                privileges: [
                  { resource: { db: "loan_db", collection: "idempotency_keys" }, actions: ["find"] }
                ]
              }
        - runCommand:
            command: >
              {
                revokePrivilegesFromRole: "circulation_writer",
                privileges: [
                  { resource: { db: "loan_db", collection: "idempotency_keys" }, actions: ["find", "insert"] }
                ]
              }
  - changeSet:
      id: dcl-roles-004
      author: OscarAreiza
      labels: "governance,dcl,roles"
      comment: >
        dcl-roles-002 granted circulation_writer only find+insert on
        idempotency_keys — IdempotencyStore.Save (same upsert-via-ReplaceOne
        pattern as LoanRepository.Save) needs update too, or the very first
        write for a new key fails Unauthorized even though it's an upsert:
        MongoDB's replaceOne is authorized under the update action regardless
        of whether it ends up inserting or replacing. Confirmed live against
        a running instance: POST /loans completed the real registration
        (Loan saved, catalog-service's copy count decremented) but then
        returned 500 because this exact grant was missing, so the loan was
        silently created without the client ever seeing a success response.
      changes:
        - runCommand:
            command: >
              {
                grantPrivilegesToRole: "circulation_writer",
                privileges: [
                  { resource: { db: "loan_db", collection: "idempotency_keys" }, actions: ["update"] }
                ]
              }
      rollback:
        - runCommand:
            command: >
              {
                revokePrivilegesFromRole: "circulation_writer",
                privileges: [
                  { resource: { db: "loan_db", collection: "idempotency_keys" }, actions: ["update"] }
                ]
              }
