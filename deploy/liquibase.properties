# Read by loan-migrate (deploy/compose.yml). The connection URL is NOT here
# — Liquibase's own ${VAR} substitution inside this file does not work
# (confirmed directly: it sends the literal string "${MONGO_ADMIN_USER}" to
# the driver instead of substituting). It's set instead via
# LIQUIBASE_COMMAND_URL in compose.yml, Liquibase's documented env-var
# configuration mechanism — resolved from lms-infra-mongo's
# env/<environment>.env (rules/3-Anexo-J, J.5.1).
#
# Migrations run as the instance administrator — they create loan_db's
# collections and roles, which the shared-instance admin must own; the
# running -api connects as circulation_app instead (created by
# lms-infra-mongo's init script, granted circulation_writer below in
# 03_dcl — never the admin).
#
# changeLogTableName/changeLogLockTableName: one shared instance means two
# domains' migration-tracking collections would collide on the default name
# (rules/3-Anexo-J, J.6) — this domain's is suffixed with its own name.
changelogFile=changelog/changelog-master.yaml
databaseChangeLogTableName=databasechangelog_circulation
databaseChangeLogLockTableName=databasechangeloglock_circulation
