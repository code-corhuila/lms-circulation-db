# This domain's own MongoDB instance and its Liquibase migration executor —
# rules/2-anexos/B-db-mongo.md. lms-infra composes this alongside the other
# per-context repos later (ADR-006-repo-per-context-decomposition.md).
#
# Runs as a single-node replica set even here in development
# (rules/2-anexos/B-db-mongo.md, rule 6) — that's what makes transactions and
# change streams available, so development behaves like production. The
# healthcheck both proves liveness and initiates the replica set on first
# boot (rs.initiate() is a no-op once already initiated).
services:
  loan-db:
    image: mongo:7
    container_name: loan-db
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-lms_user}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-lms_password}
      MONGO_INITDB_DATABASE: loan_db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate() }"
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - loan-db-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - lms-network

  loan-migrate:
    build:
      context: .
      dockerfile: liquibase.Dockerfile
    container_name: loan-migrate
    environment:
      DB_USER: ${DB_USER:-lms_user}
      DB_PASSWORD: ${DB_PASSWORD:-lms_password}
    volumes:
      - ..:/liquibase/changelog
    working_dir: /liquibase/changelog
    command:
      - "--defaultsFile=/liquibase/changelog/deploy/liquibase.properties"
      - "update"
    depends_on:
      loan-db:
        condition: service_healthy
    networks:
      - lms-network

volumes:
  loan-db-data:

networks:
  lms-network:
    driver: bridge
