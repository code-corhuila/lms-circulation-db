# This domain's Liquibase migration executor only — no database service, no
# volume. The single MongoDB instance this applies to is owned by
# lms-infra-mongo (rules/3-Anexo-J, J.1.2/J.3.1), which `include:`s this file
# (ADR-006-repo-per-context-decomposition.md). MONGO_ADMIN_USER/PASSWORD here
# are the instance administrator's, used only to run migrations — the
# running -api never connects as this user (it uses circulation_app, created
# by lms-infra-mongo's own init script, granted circulation_reader/
# circulation_writer below in 03_dcl — never the admin).
services:
  loan-migrate:
    build:
      context: .
      dockerfile: liquibase.Dockerfile
    container_name: loan-migrate
    environment:
      # Liquibase's own `${VAR}` substitution inside liquibase.properties
      # does not work (tested directly). LIQUIBASE_COMMAND_URL is
      # Liquibase's documented env-var configuration mechanism instead;
      # liquibase.properties only carries changelogFile and the per-domain
      # changelog-table names now.
      LIQUIBASE_COMMAND_URL: mongodb://${MONGO_ADMIN_USER:-lms_admin}:${MONGO_ADMIN_PASSWORD:-change-me-admin-password}@mongo:27017/loan_db?authSource=admin&replicaSet=rs0
    volumes:
      - ..:/liquibase/changelog
    working_dir: /liquibase/changelog
    command:
      - "--defaultsFile=/liquibase/changelog/deploy/liquibase.properties"
      - "update"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - platform

networks:
  platform:
    external: true
